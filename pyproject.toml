[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structstream"
version = "0.1.0"
description = "Get valid JSON out of a model that keeps almost getting it right. A repair pass plus a schema validator, with a benchmark of realistic malformed outputs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahmed Doghri" }]
keywords = ["llm", "json", "structured-output", "function-calling", "parsing", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ahmeddoghri/structstream"

[tool.hatch.build.targets.wheel]
packages = ["structstream"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I"]
